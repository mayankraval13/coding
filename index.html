<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
     iframe {
      width: 100%;
      height: 90vh;
      border: none;
    }
  </style>
</head>
<body>
  <main>
    <div id="doc-content">Loading...</div>
  </main>
  <script>
    fetch("/api/doc")
      .then((res) => res.text())
      .then((html) => {
        document.getElementById("doc-content").innerHTML = html;
      })
      .catch((err) => {
        document.getElementById("doc-content").innerText = "Failed to load document.";
        console.error(err);
      });
  </script>
</body>
</html>
